; PlatformIO Project Configuration File
;
; The sources live in the NMSVE_RMedit sketch folder so the same code also opens
; directly in the Arduino IDE (open NMSVE_RMedit/NMSVE_RMedit.ino).
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = NMSVE_RMedit

[env:firebeetle32]
platform = espressif32
board = firebeetle32
framework = arduino
lib_deps =
    thomasfredericks/Bounce2
    fortyseveneffects/MIDI Library
